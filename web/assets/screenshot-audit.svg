<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Memory Dock audit log screen</title>
  <desc id="desc">An audit log showing memory reads, exports, and privacy-safe exclusions.</desc>
  <rect width="1200" height="780" fill="#fbf7f0"/>
  <rect x="120" y="60" width="960" height="660" rx="18" fill="#f8fafc" stroke="#c9d7e5"/>
  <rect x="120" y="60" width="960" height="70" rx="18" fill="#ffffff"/>
  <rect x="120" y="112" width="960" height="18" fill="#ffffff"/>
  <circle cx="172" cy="96" r="18" fill="#2563eb"/>
  <path d="M164 95c16-25 43 7 14 11l9 17-18-13c-22 3-20-20-5-15z" fill="#fff"/>
  <text x="210" y="92" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#142033">Memory Dock</text>
  <text x="210" y="116" font-family="Inter,Arial,sans-serif" font-size="15" fill="#64748b">Audit memory access</text>
  <rect x="150" y="160" width="210" height="44" rx="8" fill="#172033"/>
  <text x="255" y="188" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Refresh audit log</text>
  <rect x="150" y="232" width="900" height="92" rx="12" fill="#fff" stroke="#d8e2ed"/>
  <circle cx="188" cy="278" r="16" fill="#dcfce7"/>
  <text x="188" y="284" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#15803d">R</text>
  <text x="224" y="268" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#172033">Search returned 2 personal travel memories</text>
  <text x="224" y="296" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b">search | 2026-06-07T16:04:22Z | q=morning flights</text>
  <rect x="150" y="344" width="900" height="92" rx="12" fill="#fff" stroke="#d8e2ed"/>
  <circle cx="188" cy="390" r="16" fill="#dbeafe"/>
  <text x="188" y="396" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#2563eb">E</text>
  <text x="224" y="380" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#172033">Generated Gemini context pack with 3 cited memories</text>
  <text x="224" y="408" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b">export | 2026-06-07T16:05:11Z | format=gemini</text>
  <rect x="150" y="456" width="900" height="92" rx="12" fill="#fff" stroke="#d8e2ed"/>
  <circle cx="188" cy="502" r="16" fill="#ffedd5"/>
  <text x="188" y="508" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#c2410c">P</text>
  <text x="224" y="492" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#172033">Excluded sensitive and never_export memories</text>
  <text x="224" y="520" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b">privacy_filter | 2026-06-07T16:05:11Z | excluded=4</text>
  <rect x="150" y="580" width="900" height="86" rx="12" fill="#172033"/>
  <text x="176" y="614" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">Elastic MCP proof</text>
  <text x="176" y="646" font-family="Inter,Arial,sans-serif" font-size="16" fill="#cbd5e1">Agent retrieval is logged, scoped, and tied back to memory IDs before export.</text>
</svg>
